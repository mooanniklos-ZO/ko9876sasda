name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is required for a real signed release APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          chmod +x gradlew

      - name: Build Unsigned Release APK
        env:
          MANUAL_APKSIGN: 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Sign Release APK with OpenSSL + apksigner
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"

          rm -f signer-key.pem signer-key.pk8 signer-cert.pem

          extract_signer() {
            local pass_var="$1"
            local pass_value="${!pass_var:-}"
            if [ -z "$pass_value" ]; then
              return 1
            fi

            rm -f signer-key.pem signer-cert.pem
            if openssl pkcs12 \
              -in my-upload-key.jks \
              -nocerts -nodes \
              -passin "env:$pass_var" \
              -out signer-key.pem >/dev/null 2>&1 && \
              openssl pkcs12 \
              -in my-upload-key.jks \
              -clcerts -nokeys \
              -passin "env:$pass_var" \
              -out signer-cert.pem >/dev/null 2>&1; then
              return 0
            fi

            rm -f signer-key.pem signer-cert.pem
            if openssl pkcs12 -legacy \
              -in my-upload-key.jks \
              -nocerts -nodes \
              -passin "env:$pass_var" \
              -out signer-key.pem >/dev/null 2>&1 && \
              openssl pkcs12 -legacy \
              -in my-upload-key.jks \
              -clcerts -nokeys \
              -passin "env:$pass_var" \
              -out signer-cert.pem >/dev/null 2>&1; then
              return 0
            fi

            rm -f signer-key.pem signer-cert.pem
            return 1
          }

          signer_source=""
          for candidate in CM_KEYSTORE_PASSWORD CM_KEY_PASSWORD KEYSTORE_PASSWORD; do
            if extract_signer "$candidate"; then
              signer_source="$candidate"
              break
            fi
          done

          if [ -z "$signer_source" ]; then
            echo "ERROR: none of the configured keystore-password secrets can open KEYSTORE_BASE64."
            echo "Update CM_KEYSTORE_PASSWORD (or KEYSTORE_PASSWORD) to the exact password used when the keystore was created, then rerun the workflow."
            exit 1
          fi

          echo "Keystore opened successfully using the configured secret source: $signer_source"

          openssl pkcs8 \
            -topk8 \
            -inform PEM \
            -outform DER \
            -in signer-key.pem \
            -out signer-key.pk8 \
            -nocrypt

          test -s signer-key.pk8
          test -s signer-cert.pem

          "$apksigner" sign \
            --key signer-key.pk8 \
            --cert signer-cert.pem \
            --out "$signed" \
            "$unsigned"

          test -s "$signed"
          "$apksigner" verify --verbose --print-certs "$signed"
          ls -lh "$signed"

          rm -f signer-key.pem signer-key.pk8 signer-cert.pem my-upload-key.jks

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p output_apk
          cp app/build/outputs/apk/release/app-release.apk output_apk/Halawat-AlSheir-v1.0-release.apk
          test -s output_apk/Halawat-AlSheir-v1.0-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halawat-AlSheir-Android15-APK
          path: output_apk/Halawat-AlSheir-v1.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "ديوان وللشعر حلاوة كحلاوة السكر - الإصدار v1.0.${{ github.run_number }}"
          body: |
            ## ديوان «وللشعر حلاوة كحلاوة السكر»
            **للمؤلف والشاعر: د. مالك عبدالرحمن الرميمة**

            تم بناء حزمة Release APK موقعة من مصدر المشروع نفسه.
          files: output_apk/Halawat-AlSheir-v1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
