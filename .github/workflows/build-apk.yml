name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          echo "Preparing environment configuration..."

          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
            echo "Successfully configured .env with GEMINI_API_KEY."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example to .env."
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is required for a real signed release APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          echo "Successfully decoded signing keystore."

          chmod +x gradlew

      - name: Build Signed Release APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          set -euo pipefail
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Building the real signed Release APK..."
          ./gradlew --no-daemon clean assembleRelease --stacktrace

      - name: Verify Release APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          echo "Verified Release APK: $apk"
          ls -lh "$apk"

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p output_apk
          cp app/build/outputs/apk/release/app-release.apk output_apk/Halawat-AlSheir-v1.0-release.apk
          test -s output_apk/Halawat-AlSheir-v1.0-release.apk
          ls -lh output_apk/Halawat-AlSheir-v1.0-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halawat-AlSheir-Android15-APK
          path: output_apk/Halawat-AlSheir-v1.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "ديوان وللشعر حلاوة كحلاوة السكر - الإصدار v1.0.${{ github.run_number }}"
          body: |
            ## ديوان «وللشعر حلاوة كحلاوة السكر» 📖✨
            **للمؤلف والشاعر: د. مالك عبدالرحمن الرميمة**

            تم بناء حزمة التثبيت الرسمية الموقعة (APK) من مصدر المشروع نفسه.

            ### 📥 تحميل التطبيق
            حمّل الملف **Halawat-AlSheir-v1.0-release.apk** من أصول هذا الإصدار.

            ### 🌟 مميزات الإصدار
            1. الديوان الشعري الكامل.
            2. التلاوة الصوتية التفاعلية.
            3. مشغل صوتي مصغر.
            4. البحث والانتقال برقم الصفحة.
            5. المفضلة والعلامات ودفتر الخواطر عبر Room Database.
            6. تخصيص واجهة القراءة وحجم الخط.
          files: output_apk/Halawat-AlSheir-v1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
