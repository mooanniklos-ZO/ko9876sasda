name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is required for a real signed release APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          chmod +x gradlew

      - name: Build Unsigned Release APK
        env:
          MANUAL_APKSIGN: 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          ls -lh "$apk"

      - name: Sign Release APK with apksigner
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          test -s my-upload-key.jks

          if [ -z "${CM_KEY_ALIAS:-}" ]; then
            echo "ERROR: CM_KEY_ALIAS is required for the signed release APK."
            exit 1
          fi

          # Android signing can use either a JKS or PKCS12 keystore directly.
          # The previous workflow forced OpenSSL PKCS12 parsing, which fails
          # when the supplied signing file is a normal JKS keystore.
          store_pass=""
          store_source=""
          for candidate in CM_KEYSTORE_PASSWORD KEYSTORE_PASSWORD; do
            value="${!candidate:-}"
            if [ -z "$value" ]; then
              continue
            fi
            if keytool -list -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$value" \
              -alias "$CM_KEY_ALIAS" >/dev/null 2>&1; then
              store_pass="$value"
              store_source="$candidate"
              break
            fi
          done

          if [ -z "$store_pass" ]; then
            echo "ERROR: the configured keystore password cannot open the supplied KEYSTORE_BASE64 with CM_KEY_ALIAS."
            echo "The keystore file, store password, or CM_KEY_ALIAS does not match."
            exit 1
          fi

          echo "Keystore and alias verified using $store_source."

          key_pass="${CM_KEY_PASSWORD:-}"
          if [ -n "$key_pass" ]; then
            if ! keytool -list -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$store_pass" \
              -alias "$CM_KEY_ALIAS" \
              -keypass "$key_pass" >/dev/null 2>&1; then
              key_pass=""
            fi
          fi
          if [ -z "$key_pass" ]; then
            key_pass="$store_pass"
            if ! keytool -list -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$store_pass" \
              -alias "$CM_KEY_ALIAS" \
              -keypass "$key_pass" >/dev/null 2>&1; then
              echo "ERROR: CM_KEY_PASSWORD does not match the private key, and the store password cannot be used as the key password."
              exit 1
            fi
          fi

          "$apksigner" sign \
            --ks my-upload-key.jks \
            --ks-type JKS \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --ks-pass "pass:$store_pass" \
            --key-pass "pass:$key_pass" \
            --out "$signed" \
            "$unsigned"

          test -s "$signed"
          "$apksigner" verify --verbose --print-certs "$signed"
          ls -lh "$signed"

          rm -f my-upload-key.jks

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p output_apk
          cp app/build/outputs/apk/release/app-release.apk output_apk/Halawat-AlSheir-v1.0-release.apk
          test -s output_apk/Halawat-AlSheir-v1.0-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halawat-AlSheir-Android15-APK
          path: output_apk/Halawat-AlSheir-v1.0-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "ديوان وللشعر حلاوة كحلاوة السكر - الإصدار v1.0.${{ github.run_number }}"
          body: |
            ## ديوان «وللشعر حلاوة كحلاوة السكر»
            **للمؤلف والشاعر: د. مالك عبدالرحمن الرميمة**

            تم بناء حزمة Release APK موقعة من مصدر المشروع نفسه.
          files: output_apk/Halawat-AlSheir-v1.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
